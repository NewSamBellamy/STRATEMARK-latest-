<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="500" cy="420" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="480" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="primaryCardBg" x1="0" y1="0" x2="480" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0D131F"/>
    </linearGradient>

    <linearGradient id="emblemGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="480" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowBg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle Shape for macOS App Icon -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glowGrad)"/>

  <!-- Inner Rim Highlight -->
  <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Center Decorative Grid Lines -->
  <g opacity="0.1" stroke="#818CF8" stroke-width="1.5">
    <line x1="128" y1="256" x2="896" y2="256"/>
    <line x1="128" y1="512" x2="896" y2="512"/>
    <line x1="128" y1="768" x2="896" y2="768"/>
    <line x1="256" y1="128" x2="256" y2="896"/>
    <line x1="512" y1="128" x2="512" y2="896"/>
    <line x1="768" y1="128" x2="768" y2="896"/>
  </g>

  <!-- STACKED DECK ARTWORK -->

  <!-- Back Card (-10 deg rotation) -->
  <g transform="translate(512, 530) rotate(-10) translate(-230, -300)" filter="url(#cardShadow)">
    <rect width="460" height="600" rx="32" fill="url(#cardBg)" opacity="0.75"/>
    <rect width="460" height="600" rx="32" fill="none" stroke="#4F46E5" stroke-width="3" opacity="0.5"/>
    <path d="M 60 480 Q 150 420 240 450 T 400 320" fill="none" stroke="#818CF8" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Middle Card (+8 deg rotation) -->
  <g transform="translate(512, 520) rotate(8) translate(-230, -300)" filter="url(#cardShadow)">
    <rect width="460" height="600" rx="32" fill="url(#cardBg)" opacity="0.9"/>
    <rect width="460" height="600" rx="32" fill="none" stroke="#A855F7" stroke-width="3.5" opacity="0.7"/>
    <rect x="60" y="440" width="120" height="14" rx="7" fill="#A855F7" opacity="0.6"/>
    <rect x="60" y="475" width="220" height="14" rx="7" fill="#6366F1" opacity="0.6"/>
  </g>

  <!-- Front Primary Card (0 deg rotation) -->
  <g transform="translate(512, 500) translate(-230, -300)" filter="url(#cardShadow)">
    <!-- Base Panel -->
    <rect width="460" height="600" rx="32" fill="url(#primaryCardBg)"/>
    <rect width="460" height="600" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

    <!-- Header Badge Tag -->
    <rect x="40" y="44" width="130" height="36" rx="18" fill="url(#emeraldGrad)"/>
    <text x="105" y="67" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#042F2E" letter-spacing="1">TIER 1</text>

    <rect x="350" y="44" width="70" height="36" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="385" cy="62" r="7" fill="#10B981"/>

    <!-- Emblem: Stratemark Interlocking Diamond Starburst -->
    <g transform="translate(230, 230)">
      <circle cx="0" cy="0" r="85" fill="#6366F1" opacity="0.2"/>
      <path d="M 0 -75 L 65 0 L 0 75 L -65 0 Z" fill="url(#emblemGrad)"/>
      <path d="M 0 -50 L 45 0 L 0 50 L -45 0 Z" fill="#0D131F"/>
      <path d="M 0 -28 L 24 0 L 0 28 L -24 0 Z" fill="url(#emeraldGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Card Data Gauge Lines -->
    <g transform="translate(45, 360)">
      <rect x="0" y="0" width="120" height="12" rx="6" fill="#64748B"/>
      <rect x="0" y="24" width="370" height="16" rx="8" fill="#1E293B"/>
      <rect x="0" y="24" width="310" height="16" rx="8" fill="url(#emeraldGrad)"/>

      <rect x="0" y="60" width="160" height="12" rx="6" fill="#64748B"/>
      <rect x="0" y="84" width="370" height="16" rx="8" fill="#1E293B"/>
      <rect x="0" y="84" width="240" height="16" rx="8" fill="#818CF8"/>

      <rect x="0" y="120" width="90" height="12" rx="6" fill="#64748B"/>
      <rect x="0" y="144" width="370" height="16" rx="8" fill="#1E293B"/>
      <rect x="0" y="144" width="180" height="16" rx="8" fill="#6366F1"/>
    </g>
  </g>
</svg>