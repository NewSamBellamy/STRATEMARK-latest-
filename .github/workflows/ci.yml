name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from package.json's "packageManager" field — never pin
        # it here too, or action-setup fails with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit + contract tests
        run: |
          pnpm --filter @mi/contracts test:run
          pnpm --filter @mi/mocks test:run
          pnpm --filter @mi/web test:run

      - name: Build (web + desktop main/preload)
        run: |
          pnpm build
          pnpm --filter @mi/desktop build:main

      - name: Install Playwright browser
        run: pnpm --filter @mi/web exec playwright install --with-deps chromium

      - name: E2E + accessibility
        run: pnpm --filter @mi/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
